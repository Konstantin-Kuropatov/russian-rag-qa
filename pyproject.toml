[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "russian-rag-qa"
version = "0.1.0"
description = "Reproducible SberQuAD data audit for a Russian RAG project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.34,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<24",
    "razdel>=0.5,<0.6",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "seaborn>=0.13,<0.14",
    "tokenizers>=0.21,<1",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "jupytext>=1.16,<2",
    "ipykernel>=6,<8",
]

[project.optional-dependencies]
lab = ["jupyterlab>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
rag-eda = "rag_qa_eda.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_qa_eda"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
